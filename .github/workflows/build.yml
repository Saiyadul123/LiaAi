name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Gradle project
        id: proj
        run: |
          F=$(find . -maxdepth 3 -name settings.gradle.kts | head -n1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts not found. Repo contents:"
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDirectDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          {
            echo '### Build error'
            echo '```'
            grep -n -A 15 -E "What went wrong|error:|^e: " build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiaAI-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/direct/debug/*.apk
          if-no-files-found: error

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.proj.outputs.dir }}/build.log
          if-no-files-found: ignore
