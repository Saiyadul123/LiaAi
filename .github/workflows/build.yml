name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle 9.1.0 itself, so no gradlew wrapper is required.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0

      - name: Unit tests
        run: gradle testDirectDebugUnitTest testPlayDebugUnitTest

      - name: Build debug APKs
        run: gradle assembleDirectDebug assemblePlayDebug

      - uses: actions/upload-artifact@v4
        with:
          name: lia-ai-direct-debug
          path: app/build/outputs/apk/direct/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lia-ai-play-debug
          path: app/build/outputs/apk/play/debug/*.apk
          
